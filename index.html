<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>m7mddz File Manager</title>
<style>
:root{--bg:#0b0b0d;--panel:#16161a;--line:#26262d;--fg:#f2f2f4;--dim:#8d8d99;--acc:#ffffff;--danger:#ff5a5f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:18px;margin:0;letter-spacing:.5px}
header small{color:var(--dim)}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,.btn{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#555}
button.danger{color:var(--danger)}
input[type=text],input[type=password]{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;min-width:0}
#search{flex:1;min-width:140px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.quick button{font-size:13px;padding:5px 10px}
#crumbs{direction:ltr;text-align:left;color:var(--dim);word-break:break-all;margin:8px 0}
#crumbs a{color:var(--fg);cursor:pointer;text-decoration:none}
#crumbs a:hover{text-decoration:underline}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.row:last-child{border-bottom:0}
.row:hover{background:#1c1c22}
.name{direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.meta{color:var(--dim);font-size:12px;white-space:nowrap}
.acts{display:flex;gap:4px}
.acts button{padding:4px 8px;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--dim)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:10px;display:none;z-index:20}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:30}
#lock input{text-align:center;font-size:24px;width:160px;letter-spacing:6px}
#clip{color:var(--dim);font-size:13px}
@media(max-width:560px){.row{grid-template-columns:24px 1fr auto}.row .meta.sz{display:none}}
</style>
</head>
<body>
<div id="lock">
  <h1>m7mddz 🕶️</h1>
  <div>أدخل رمز PIN الظاهر على شاشة PS4</div>
  <input id="pin" type="password" inputmode="numeric" maxlength="4" autofocus>
  <button id="go">دخول</button>
  <div id="lockerr" style="color:var(--danger)"></div>
</div>

<header><h1>m7mddz</h1><small>File Manager · PS4</small></header>
<div class="wrap">
  <div class="quick" id="quick"></div>
  <div id="crumbs"></div>
  <div class="bar">
    <input id="search" type="text" placeholder="بحث في هذا المجلد…">
    <button id="up">⬆ للأعلى</button>
    <button id="mk">📁 مجلد جديد</button>
    <label class="btn">⬆ رفع ملف<input id="file" type="file" multiple hidden></label>
    <button id="paste" style="display:none">📋 لصق</button>
    <button id="refresh">⟳</button>
  </div>
  <div id="clip"></div>
  <div class="list" id="list"></div>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let PIN=sessionStorage.getItem('pin')||'', cwd='/', items=[], clip=null;
const QUICK=['/','/user','/user/app','/user/appmeta','/user/home','/system','/system_data','/data','/mnt/usb0','/mnt/usb1','/mnt/ext0','/av_contents'];

function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500)}
const enc=encodeURIComponent;
async function api(name,params={},opt={}){
  const q=new URLSearchParams(params).toString();
  const r=await fetch('/api/'+name+(q?'?'+q:''),{...opt,headers:{'X-Pin':PIN}});
  if(r.status===401){lock('رمز PIN غير صحيح');throw new Error('pin')}
  const j=await r.json().catch(()=>({ok:false,error:'bad response'}));
  if(!j.ok)throw new Error(j.error||'error');
  return j;
}
function lock(msg){$('#lock').style.display='flex';$('#lockerr').textContent=msg||''}
async function login(){
  PIN=$('#pin').value.trim();
  try{await api('ping');sessionStorage.setItem('pin',PIN);$('#lock').style.display='none';load('/')}catch(e){}
}
$('#go').onclick=login;$('#pin').onkeydown=e=>{if(e.key==='Enter')login()};

const join=(a,b)=>(a==='/'?'':a)+'/'+b;
const fmt=n=>{if(n<1024)return n+' B';const u=['KB','MB','GB','TB'];let i=-1;do{n/=1024;i++}while(n>=1024&&i<3);return n.toFixed(n<10?2:1)+' '+u[i]};

async function load(p){
  try{
    const j=await api('list',{path:p});
    cwd=j.path;items=j.items.sort((a,b)=>b.d-a.d||a.n.localeCompare(b.n));
    render();
  }catch(e){if(e.message!=='pin')toast('تعذر فتح المجلد: '+e.message)}
}
function render(){
  const f=$('#search').value.toLowerCase();
  const parts=cwd.split('/').filter(Boolean);
  let h='<a data-p="/">/</a>',acc='';
  parts.forEach(s=>{acc+='/'+s;h+=`<a data-p="${acc}">${esc(s)}</a>/`});
  $('#crumbs').innerHTML=h;
  $('#crumbs').querySelectorAll('a').forEach(a=>a.onclick=()=>load(a.dataset.p));

  const l=$('#list');
  const shown=items.filter(i=>i.n.toLowerCase().includes(f));
  if(!shown.length){l.innerHTML='<div class="empty">لا توجد عناصر</div>';return}
  l.innerHTML='';
  shown.forEach(i=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<span>${i.d?'📁':'📄'}</span><span class="name">${esc(i.n)}</span><span class="meta sz">${i.d?'':fmt(i.s)}</span><span class="acts"></span>`;
    r.querySelector('.name').onclick=()=>i.d?load(join(cwd,i.n)):dl(i);
    const a=r.querySelector('.acts');
    const add=(t,fn,c)=>{const b=document.createElement('button');b.textContent=t;if(c)b.className=c;b.onclick=fn;a.appendChild(b)};
    if(!i.d)add('⬇',()=>dl(i));
    add('✏️',()=>ren(i));
    add('📄',()=>{clip={p:join(cwd,i.n),n:i.n,mode:'copy'};setClip()});
    add('✂️',()=>{clip={p:join(cwd,i.n),n:i.n,mode:'move'};setClip()});
    add('🗑',()=>del(i),'danger');
    l.appendChild(r);
  });
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setClip(){
  $('#paste').style.display=clip?'':'none';
  $('#clip').textContent=clip?(clip.mode==='copy'?'نسخ: ':'نقل: ')+clip.p:'';
}
function dl(i){location.href='/api/download?pin='+enc(PIN)+'&path='+enc(join(cwd,i.n))}
async function ren(i){
  const n=prompt('الاسم الجديد',i.n);if(!n||n===i.n)return;
  try{await api('rename',{from:join(cwd,i.n),to:join(cwd,n)});toast('تم');load(cwd)}catch(e){toast('فشل: '+e.message)}
}
async function del(i){
  if(!confirm('حذف "'+i.n+'" نهائياً؟'+(i.d?'\n(سيُحذف المجلد بكل محتوياته)':'')))return;
  try{await api('delete',{path:join(cwd,i.n)});toast('تم الحذف');load(cwd)}catch(e){toast('فشل: '+e.message)}
}
$('#mk').onclick=async()=>{
  const n=prompt('اسم المجلد الجديد');if(!n)return;
  try{await api('mkdir',{path:join(cwd,n)});load(cwd)}catch(e){toast('فشل: '+e.message)}
};
$('#paste').onclick=async()=>{
  if(!clip)return;
  try{
    toast('جاري العمل…');
    await api(clip.mode,{from:clip.p,to:join(cwd,clip.n)});
    if(clip.mode==='move'){clip=null;setClip()}
    toast('تم');load(cwd);
  }catch(e){toast('فشل: '+e.message)}
};
$('#up').onclick=()=>{const p=cwd.split('/').filter(Boolean);p.pop();load('/'+p.join('/'))};
$('#refresh').onclick=()=>load(cwd);
$('#search').oninput=render;
$('#file').onchange=async e=>{
  for(const f of e.target.files){
    toast('رفع '+f.name+'…');
    try{
      const r=await fetch('/api/upload?path='+enc(join(cwd,f.name)),{method:'POST',headers:{'X-Pin':PIN},body:f});
      const j=await r.json();if(!j.ok)throw new Error(j.error);
    }catch(err){toast('فشل رفع '+f.name);continue}
  }
  e.target.value='';toast('انتهى الرفع');load(cwd);
};
const q=$('#quick');
QUICK.forEach(p=>{const b=document.createElement('button');b.textContent=p;b.style.direction='ltr';b.onclick=()=>load(p);q.appendChild(b)});

if(PIN){api('ping').then(()=>{$('#lock').style.display='none';load('/')}).catch(()=>{})}
</script>
</body>
</html>
